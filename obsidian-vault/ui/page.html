<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obsidian 知识库工作台</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; min-width: 0; }
body {
  margin: 0;
  padding: 14px;
  font: 13px/1.55 var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif);
  color: var(--color-text-primary, CanvasText);
  background: var(--color-background-primary, Canvas);
}
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.top-actions, .vault-field { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.vault-field { flex: 1; }
.vault-field select { flex: 1; min-width: 8rem; }
:focus-visible { outline: 2px solid var(--color-ring-primary, Highlight); outline-offset: 2px; }
.vault-select {
  font-size: 12px;
  padding: 4px 8px;
  max-width: 100%;
}
.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}
button, input, textarea, select {
  font: inherit;
  color: inherit;
  border-radius: 8px;
  border: 1px solid var(--color-border-primary, rgba(128,128,128,0.3));
  background: var(--color-background-secondary, rgba(128,128,128,0.08));
}
button {
  padding: 7px 10px;
  cursor: pointer;
  font-weight: 500;
  transition: opacity .15s;
}
button:hover:not(:disabled) { opacity: 0.86; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.tab-btn.active {
  border-color: var(--color-text-primary, CanvasText);
  font-weight: 600;
}
.btn-primary {
  background: var(--color-text-primary, CanvasText);
  color: var(--color-background-primary, Canvas);
  border-color: transparent;
}
.search-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.search-row input { flex: 1; padding: 7px 10px; }
.stats-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  font-size: 12px;
  opacity: 0.82;
}
.note-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 240px;
  overflow-y: auto;
  margin-bottom: 12px;
}
.note-item {
  text-align: left;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.note-item.selected {
  border-color: var(--color-text-primary, CanvasText);
}
.note-item-title { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.note-item-meta { font-size: 11px; opacity: 0.72; overflow-wrap: anywhere; }
.links-meta { margin-bottom: 8px; }
.link-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.link-list button { padding: 3px 7px; overflow-wrap: anywhere; }
.list-heading { font-size: 12px; margin: 0 0 6px; font-weight: 600; }
.help { margin: 0 0 10px; font-size: 12px; opacity: .8; overflow-wrap: anywhere; }
#search-input { width: 0; }
.card {
  border: 1px solid var(--color-border-primary, rgba(128,128,128,0.25));
  border-radius: 10px;
  padding: 12px;
  background: var(--color-background-secondary, rgba(128,128,128,0.05));
  margin-bottom: 10px;
}
.preview-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.preview-title { font-size: 15px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.tag-list { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tag {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 6px;
  border: 1px solid var(--color-border-primary, rgba(128,128,128,0.25));
}
.preview-body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 280px;
  overflow-y: auto;
  font-size: 12.5px;
  line-height: 1.6;
  padding-top: 6px;
  border-top: 1px solid var(--color-border-primary, rgba(128,128,128,0.18));
}
.daily-preview { margin-bottom: 10px; }
.daily-textarea { min-height: 72px; }
.action-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
label.field { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 500; }
label.field input, label.field textarea, label.field select {
  display: block;
  width: 100%;
  margin-top: 4px;
  padding: 7px 9px;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
#status {
  font-size: 12px;
  opacity: 0.85;
  margin: 0 0 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.companion-row {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  padding: 8px 0;
  border-top: 1px solid var(--color-border-primary, rgba(128,128,128,0.18));
}
.companion-row:first-child { border-top: 0; }
.companion-name { flex: 1 1 8rem; font-weight: 600; overflow-wrap: anywhere; }
.companion-row input { flex: 2 1 12rem; padding: 6px 8px; }
.companion-row button { padding: 5px 9px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="top-bar">
  <label class="vault-field">
    <span data-en="Vault">知识库</span>
    <select id="vault-select" class="vault-select" disabled></select>
  </label>
  <div class="top-actions">
    <button id="btn-pick-vault" type="button" disabled data-en="Add vault">添加知识库</button>
    <button id="btn-refresh" type="button" disabled data-en="Refresh index">刷新索引</button>
  </div>
</header>
<p id="execution-origin" class="help" data-en="This workbench accesses the vault on the computer running the plugin.">此工作台读写运行插件的电脑上的知识库。</p>
<p id="status" role="status">正在连接 Cindy…</p>
<section id="write-recovery" class="card hidden">
  <p id="recovery-target" class="help"></p>
  <p id="recovery-status" class="help" role="status"></p>
  <div class="action-bar">
    <button id="btn-check-write" type="button" data-en="Check save result">检查保存结果</button>
    <button id="btn-retry-write" class="hidden" type="button" data-en="Retry this save">重试这次保存</button>
    <button id="btn-dismiss-write" class="hidden" type="button" data-en="I checked the note">已核对目标笔记</button>
  </div>
</section>
<section id="empty-vault" class="card hidden">
  <h2 class="preview-title" data-en="Choose a vault to get started">选择一个知识库开始</h2>
  <p class="help" data-en="Choose a vault above or add a folder from the computer running the plugin.">从上方选择知识库，或添加插件运行电脑上的文件夹。</p>
</section>

<nav class="tabs" aria-label="Obsidian">
  <button class="tab-btn active" data-tab="browse" aria-controls="panel-browse" aria-pressed="true" type="button" data-en="Browse">浏览</button>
  <button class="tab-btn" data-tab="capture" aria-controls="panel-capture" aria-pressed="false" type="button" data-en="Save a note">保存笔记</button>
  <button class="tab-btn" data-tab="daily" aria-controls="panel-daily" aria-pressed="false" type="button" data-en="Daily note">今日日记</button>
</nav>

<section id="panel-browse" class="hidden">
  <form id="search-form" class="search-row">
    <input id="search-input" type="search" maxlength="200">
    <button type="submit" data-en="Search">搜索</button>
    <button id="btn-clear-search" class="hidden" type="button" data-en="Clear">清除</button>
  </form>
  <div id="vault-stats" class="stats-row"></div>
  <details id="vault-write-settings">
    <summary data-en="Vault write rules">知识库写入规则</summary>
    <form id="vault-policy-form" class="card">
      <label><input id="vault-read-only" type="checkbox"> <span data-en="Read-only vault">只读知识库</span></label>
      <label class="field"><span data-en="Write access">写入范围</span>
        <select id="vault-write-scope">
          <option value="all" data-en="Entire vault">全库</option>
          <option value="folders" data-en="Selected folders only">仅指定目录</option>
        </select>
      </label>
      <label id="vault-folders-label" class="field hidden"><span data-en="Vault-relative folders, one per line">库内相对目录，每行一个</span>
        <textarea id="vault-write-folders" rows="3" maxlength="7712" placeholder="Inbox&#10;Daily"></textarea>
        <small data-en="An empty list blocks all writes.">留空时禁止写入所有目录。</small>
      </label>
      <button id="btn-save-policy" type="submit" data-en="Save write rules">保存规则</button>
    </form>
  </details>
  <details id="companion-settings">
    <summary data-en="Partner folders">伙伴专属文件夹</summary>
    <div class="card">
      <p id="companion-help" class="help"></p>
      <div id="companion-list"></div>
    </div>
  </details>
  <div class="action-bar">
    <button id="btn-folders" type="button" data-en="Browse folders">浏览目录</button>
    <button id="btn-parent" class="hidden" type="button" data-en="Up one level">返回上级</button>
  </div>
  <h2 id="list-heading" class="list-heading"></h2>
  <div id="note-list" class="note-list"></div>
  <button id="btn-next-search" class="hidden" type="button" data-en="Load more results">加载更多结果</button>
  <div id="note-preview" class="card hidden">
    <div class="preview-header">
      <div>
        <h2 id="prev-title" class="preview-title"></h2>
        <div id="prev-path" class="note-item-meta"></div>
      </div>
    </div>
    <div id="prev-tags" class="tag-list"></div>
    <div id="prev-links" class="note-item-meta links-meta"></div>
    <div id="prev-body" class="preview-body"></div>
    <p id="prev-truncated" class="help hidden" data-en="Showing the start of this note. Open it in Obsidian to read the full text.">这里只显示笔记开头，全文可在 Obsidian 中阅读。</p>
    <details id="note-links" class="hidden">
      <summary data-en="Linked notes">关联笔记</summary>
      <div id="link-list" class="link-list"></div>
    </details>
    <div class="action-bar">
      <button id="btn-insert-draft" type="button" data-en="Insert reference in draft">插入输入框引用</button>
      <button id="btn-open-obs" type="button" data-en="Open Obsidian on the vault computer">在知识库所在电脑打开 Obsidian</button>
    </div>
  </div>
</section>

<section id="panel-capture" class="hidden">
  <div id="save-receipt" class="card hidden">
    <p id="saved-path" class="help"></p>
    <div class="action-bar">
      <button id="btn-view-saved" type="button" data-en="View saved note">查看已保存的笔记</button>
      <button id="btn-open-saved" type="button" data-en="Open in Obsidian">在 Obsidian 中打开</button>
      <button id="btn-edit-reply" class="hidden" type="button" data-en="Edit and save again">修改后另存</button>
    </div>
  </div>
  <form id="capture-form" class="card">
    <p id="capture-target" class="help"></p>
    <p id="capture-source" class="help hidden" role="status"></p>
    <label class="field"><span data-en="Path within the vault">库内相对路径</span>
      <input id="cap-path" required placeholder="Inbox/Note.md" maxlength="240">
    </label>
    <label class="field"><span data-en="Save as">写入方式</span>
      <select id="cap-mode">
        <option value="create" data-en="Create note">新建笔记</option>
        <option value="append" data-en="Append to note">追加到末尾</option>
        <option value="append-heading" data-en="Append under a heading">追加到章节</option>
      </select>
    </label>
    <label id="cap-heading-wrap" class="field hidden"><span data-en="Heading">章节标题</span>
      <input id="cap-heading" disabled maxlength="120">
    </label>
    <label class="field"><span data-en="Tags (comma-separated)">标签（以逗号分隔）</span>
      <input id="cap-tags" placeholder="project, Cindy" maxlength="200">
    </label>
    <label class="field"><span data-en="Markdown (supports [[wikilinks]])">Markdown 正文（支持 [[双链]]）</span>
      <textarea id="cap-content" required maxlength="100000"></textarea>
    </label>
    <div class="action-bar">
      <button id="btn-fill-context" type="button" data-en="Use message or selection">填入当前消息/选中文本</button>
      <button id="btn-save-note" class="btn-primary" type="submit" data-en="Save note">保存到知识库</button>
    </div>
  </form>
</section>

<section id="panel-daily" class="hidden">
  <div class="card">
    <div class="preview-header">
      <h2 id="daily-title" class="preview-title"></h2>
      <button id="btn-load-daily" type="button" data-en="Refresh note">刷新今日</button>
    </div>
    <div id="daily-body" class="preview-body daily-preview"></div>
    <form id="daily-form">
      <label class="field"><span data-en="New entry or task">新记录或待办</span>
        <textarea id="daily-input" class="daily-textarea" rows="3" maxlength="100000" required></textarea>
      </label>
      <div class="action-bar">
        <button id="btn-daily-append" class="btn-primary" type="submit" data-en="Append entry">追加记录</button>
        <button id="btn-daily-task" type="button" data-en="Add task">添加为待办 (- [ ])</button>
      </div>
    </form>
  </div>
</section>

<script type="module">
import { App } from '@modelcontextprotocol/ext-apps';

const app = new App({ name: 'Obsidian Vault', version: '1.1.3' }, {}, { autoResize: true });
const $ = (selector) => document.querySelector(selector);
const controller = new AbortController();
const themeVariable = /^--(?:color|font|border|radius|shadow|spacing|surface|text|bg)-[a-z0-9-]+$/i;
let appliedThemeVars = new Set();
let initialized = false;
let statusPayload = null;
let vault = null;
let activeTab = 'browse';
let currentNote = null;
let savedNote = null;
let recentNotes = [];
let listItems = [];
let browsedFolder = '';
let searchPage = null;
let localDate = '';
let dailyDate = '';
let inbox = 'Inbox';
let chinese = null;
let lastMessage = '';
let replyEdited = false;
let statusPending = false;
let pickerPending = false;
let writePending = false;
let previewRequest = 0;
let searchRequest = 0;
let dailyRequest = 0;
let statusRequest = 0;
let draftPending = false;
let connectionReady = false;
let executionHost = '';
let pendingWrite = null;
let recoveryState = '';
let policyPending = false;
let writePolicy = { readOnly: false, writeFolders: null };
let companion = null;
let companionLookup = '';
let companionsLoading = false;
let autoFilledPath = '';
let replySave = { key: '', state: '' };

const ui = (zh, en) => chinese ? zh : en;
const defaultFolder = () => companion?.folder || inbox;
const setStatus = (message = '') => { $('#status').textContent = message; };

function syncHostContext() {
  const ctx = app.getHostContext() ?? {};
  if (ctx.theme === 'light' || ctx.theme === 'dark') document.documentElement.style.colorScheme = ctx.theme;
  if (ctx.styles?.variables) {
    const nextVars = new Set();
    for (const [key, value] of Object.entries(ctx.styles.variables)) {
      if (themeVariable.test(key) && typeof value === 'string' && value.length <= 200 && !/[;{}]/.test(value)) {
        document.documentElement.style.setProperty(key, value);
        nextVars.add(key);
      }
    }
    for (const key of appliedThemeVars) {
      if (!nextVars.has(key)) document.documentElement.style.removeProperty(key);
    }
    appliedThemeVars = nextVars;
  }
  const isChinese = /^(zh-CN|zh-Hans)(-|$)/i.test(ctx.locale ?? '');
  if (isChinese !== chinese) {
    chinese = isChinese;
    document.documentElement.lang = ui('zh-CN', 'en');
    document.title = ui('Obsidian 知识库', 'Obsidian Vault');
    for (const element of document.querySelectorAll('[data-en]')) {
      element.dataset.zh ??= element.textContent;
      element.textContent = ui(element.dataset.zh, element.dataset.en);
    }
    const searchLabel = ui('搜索标题、正文或 #标签', 'Search titles, text, or #tags');
    $('#search-input').placeholder = searchLabel;
    $('#search-input').setAttribute('aria-label', searchLabel);
  }
  const context = ctx.cindy;
  if (isReplyCapture(context)) {
    if (activeTab !== 'capture') showTab('capture');
  } else if (context?.input?.mode === 'capture') {
    const text = contextText(true);
    if (text && text !== lastMessage) {
      lastMessage = text;
      showTab('capture');
      if (!$('#cap-content').value.trim()) {
        $('#cap-content').value = text;
      } else if ($('#cap-content').value !== text) {
        setStatus(ui('已保留当前草稿。点击「填入当前消息/选中文本」可替换正文。', 'Your draft is still here. Choose “Use message or selection” to replace the body.'));
      }
      updateTarget();
    }
  }
  updateControls();
  void autoSaveReply();
  void loadCompanion();
}

function isReplyCapture(ctx) {
  return ctx?.source?.viewId === 'reply-capture';
}

function replyText(message) {
  const content = message?.content;
  const body = Array.isArray(content)
    ? content.map((block) => typeof block === 'string' ? block : block?.text).filter(Boolean).join('\n\n')
    : content;
  for (const value of [body, message?.markdown, message?.text]) {
    if (typeof value === 'string' && value.trim()) return value.trim();
  }
  return '';
}

function contextText(preferMessage = false) {
  const ctx = app.getHostContext()?.cindy;
  const messageText = replyText(ctx?.context?.message);
  if (isReplyCapture(ctx)) return messageText;
  const selected = (ctx?.selection?.text || ctx?.draft?.selection?.text || '').trim();
  return preferMessage ? messageText || selected : selected || messageText;
}

function updateTarget() {
  const partner = companion?.folder
    ? ui(' · 伙伴「' + companion.name + '」的文件夹 ' + companion.folder, ' · ' + companion.name + '’s folder ' + companion.folder)
    : '';
  $('#capture-target').textContent = vault ? ui('保存到「' + vault.name + '」', 'Save to ' + vault.name) + partner + writePolicyLabel() : '';
  const path = $('#cap-path');
  path.placeholder = defaultFolder() + '/Note.md';
  // Refill only a path this page filled in, so a partner folder found later replaces the inbox default.
  if (!vault || activeTab !== 'capture' || (path.value.trim() && path.value !== autoFilledPath)) return;
  const title = app.getHostContext()?.cindy?.context?.task?.title ?? '';
  const stem = title.replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim().slice(0, 80);
  const fallback = ui('笔记', 'Note') + (localDate ? '-' + localDate : '');
  path.value = defaultFolder() + '/' + (stem || fallback) + '.md';
  autoFilledPath = path.value;
}

function writePolicyLabel() {
  if (writePolicy.readOnly || writePolicy.writeFolders?.length === 0) return ui(' · 禁止写入', ' · Writes disabled');
  if (writePolicy.writeFolders) return ui(' · 允许写入指定目录', ' · Writes limited to selected folders');
  return '';
}

function renderWritePolicy() {
  $('#vault-read-only').checked = writePolicy.readOnly;
  $('#vault-write-scope').value = writePolicy.writeFolders === null ? 'all' : 'folders';
  $('#vault-write-folders').value = writePolicy.writeFolders?.join('\n') ?? '';
  $('#vault-folders-label').classList.toggle('hidden', writePolicy.writeFolders === null);
}

function updateControls() {
  const switching = statusPending || pickerPending || writePending || policyPending;
  const ready = Boolean(vault) && !switching;
  const writable = connectionReady && ready && !pendingWrite && !writePolicy.readOnly && writePolicy.writeFolders?.length !== 0;
  if (executionHost) {
    $('#execution-origin').textContent = ui('知识库所在电脑：' + executionHost, 'Vault computer: ' + executionHost);
  }
  const ctx = app.getHostContext()?.cindy;
  const canDraft = Boolean(ctx?.source?.sessionId && ctx.capabilities?.includes('draft'));
  const replyCapture = isReplyCapture(ctx);
  const text = contextText(ctx?.input?.mode === 'capture');
  const canFill = Boolean(text);
  if (replyCapture) {
    const body = $('#cap-content');
    if (text && !replyEdited && !body.value) body.value = text;
    const source = $('#capture-source');
    source.classList.remove('hidden');
    source.textContent = text
      ? ui('来源为这条 AI 回复。保存前可以编辑正文。', 'Source: this AI reply. You can edit it before saving.')
      : ui('Cindy 尚未提供这条回复的正文。可以返回原文重试，或复制正文后粘贴到这里。', 'Cindy has not provided this reply. Return to the original to retry, or copy and paste the reply here.');
    $('#btn-fill-context').textContent = ui('重新填入这条回复', 'Restore this reply');
  }
  // Under a reply the form appears only after an automatic save fails or the user chooses to edit.
  const autoSaving = replyCapture && ['', 'waiting', 'saving', 'saved'].includes(replySave.state) && Boolean(text);
  $('#capture-form').classList.toggle('hidden', autoSaving);
  $('#btn-edit-reply').classList.toggle('hidden', !replyCapture || replySave.state !== 'saved');
  $('#btn-view-saved').classList.toggle('hidden', replyCapture);
  $('#btn-open-saved').disabled = !ready || !savedNote;
  $('#vault-select').disabled = !initialized || switching || !statusPayload?.vaults?.some((item) => item.exists);
  $('#btn-refresh').disabled = !initialized || switching;
  $('#btn-pick-vault').disabled = !initialized || switching;
  $('#empty-vault').classList.toggle('hidden', !statusPayload || Boolean(vault));
  $('.tabs').classList.toggle('hidden', !vault || replyCapture);
  for (const button of document.querySelectorAll('.tab-btn')) button.disabled = switching;
  for (const tab of ['browse', 'capture', 'daily']) {
    $('#panel-' + tab).classList.toggle('hidden', !vault || tab !== activeTab);
  }
  $('#btn-save-note').disabled = !writable;
  $('#btn-daily-append').disabled = !writable;
  $('#btn-daily-task').disabled = !writable;
  for (const control of $('#vault-policy-form').elements) control.disabled = !ready;
  $('#btn-load-daily').disabled = !ready;
  $('#search-form').querySelector('button[type=submit]').disabled = !ready;
  $('#btn-folders').disabled = !ready;
  $('#btn-parent').disabled = !ready;
  $('#btn-next-search').disabled = !ready;
  $('#btn-insert-draft').classList.toggle('hidden', !canDraft);
  $('#btn-insert-draft').disabled = !ready || !currentNote || draftPending;
  $('#btn-open-obs').disabled = !ready || !currentNote;
  $('#btn-fill-context').classList.toggle('hidden', !canFill);
  $('#btn-fill-context').disabled = !ready;
  $('#btn-view-saved').disabled = !ready;
  updateRecovery();
}

function showTab(tab) {
  if (!['browse', 'capture', 'daily'].includes(tab)) return;
  activeTab = tab;
  for (const btn of document.querySelectorAll('.tab-btn')) {
    const selected = btn.dataset.tab === tab;
    btn.classList.toggle('active', selected);
    btn.setAttribute('aria-pressed', String(selected));
  }
  updateTarget();
  updateControls();
}

function toolError(message, code) {
  const error = new Error(message);
  error.code = code;
  return error;
}

async function callTool(name, args = {}, timeout = 60000) {
  const result = await app.callServerTool(
    { name, arguments: args },
    { timeout, maxTotalTimeout: timeout, signal: controller.signal }
  );
  const data = result.structuredContent;
  if (result.isError || data?.ok === false) {
    const message = data?.message || result.content?.find((part) => part.type === 'text')?.text;
    const error = toolError(message || ui('操作失败，请重试。', 'The action failed. Try again.'), data?.errorCode);
    error.writeNotCommitted = data?.writeNotCommitted === true;
    throw error;
  }
  return data ?? result;
}

function reportError(error, zh, en) {
  if (chinese && error.code) setStatus(error.message);
  else setStatus(ui(zh, en));
}

function updateRecovery() {
  const visible = Boolean(pendingWrite && recoveryState);
  $('#write-recovery').classList.toggle('hidden', !visible);
  if (!visible) return;
  $('#recovery-target').textContent = pendingWrite.vaultName + ' / ' + pendingWrite.target;
  const messages = {
    waiting: ui('未收到保存结果。恢复连接后可以检查原请求。', 'No save result was received. Check the original request after reconnecting.'),
    checking: ui('正在查询执行电脑上的写入回执…', 'Checking the save receipt on the vault computer…'),
    missing: pendingWrite.args
      ? ui('未找到写入回执。可以用原请求编号重试这次保存。', 'No receipt was found. You can retry the save with the same request ID.')
      : ui('未找到写入回执。请核对目标笔记，再决定是否重新填写并提交。', 'No receipt was found. Check the note before entering and submitting the text again.'),
    unconfirmed: ui('执行电脑收到过写入请求。请先核对目标笔记，避免重复写入。', 'The vault computer received this request. Check the note before submitting it again.'),
  };
  $('#recovery-status').textContent = messages[recoveryState];
  $('#btn-check-write').disabled = !connectionReady || writePending;
  $('#btn-retry-write').classList.toggle('hidden', recoveryState !== 'missing' || !pendingWrite.args);
  $('#btn-retry-write').disabled = writePending;
  $('#btn-dismiss-write').classList.toggle('hidden', recoveryState !== 'unconfirmed' && recoveryState !== 'missing');
  $('#btn-dismiss-write').disabled = writePending;
}

function supportsViewState() {
  return app.getHostCapabilities?.()?.experimental?.['cindy/view-state']?.version === 1;
}

function persistPendingWrite(write) {
  if (!supportsViewState()) return Promise.resolve();
  const state = write ? {
    version: 1,
    write: { key: write.key, method: write.method, vault: write.vault, vaultName: write.vaultName, target: write.target, inputHash: write.inputHash },
  } : null;
  return new Promise((resolve, reject) => {
    const id = 'obsidian-write-' + crypto.randomUUID();
    const timer = setTimeout(() => {
      window.removeEventListener('message', receive);
      reject(new Error('View state save timed out'));
    }, 10000);
    function receive(event) {
      if (event.source !== parent || event.data?.jsonrpc !== '2.0' || event.data?.id !== id) return;
      if (!Object.hasOwn(event.data, 'result') && !Object.hasOwn(event.data, 'error')) return;
      window.removeEventListener('message', receive);
      clearTimeout(timer);
      if (event.data.error) reject(new Error('View state save failed'));
      else resolve();
    }
    window.addEventListener('message', receive);
    parent.postMessage({ jsonrpc: '2.0', id, method: 'cindy/view-state/set', params: { state } }, '*');
  });
}

function restorePendingWrite() {
  if (!supportsViewState()) return;
  const state = app.getHostContext()?.['cindy/view-state'];
  const write = state?.write;
  if (state?.version === 1 && ['write_note', 'daily_note'].includes(write?.method) &&
      /^[0-9a-f-]{36}$/i.test(write.key) && typeof write.vault === 'string' &&
      typeof write.vaultName === 'string' && typeof write.target === 'string') {
    pendingWrite = write;
    recoveryState = 'waiting';
  }
}

async function clearPendingWrite() {
  pendingWrite = null;
  recoveryState = '';
  await persistPendingWrite(null).catch(() => {});
}

async function hashInput(input) {
  try {
    const bytes = new TextEncoder().encode(input);
    const hash = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(hash), (byte) => byte.toString(16).padStart(2, '0')).join('');
  } catch {
    return null;
  }
}

async function clearSavedInput(field, write) {
  const text = field.value;
  const matches = write.input === undefined
    ? write.inputHash && await hashInput(text) === write.inputHash
    : text === write.input;
  if (matches && !controller.signal.aborted && field.value === text) field.value = '';
}

async function finishWrite(write, result) {
  let tagSyncError = null;
  if (write.method === 'write_note' && vault?.id === write.vault) {
    replyEdited = true;
    await clearSavedInput($('#cap-content'), write);
    if (controller.signal.aborted) return;
    savedNote = { vault: { id: write.vault, name: write.vaultName }, path: result.path };
    $('#saved-path').textContent = write.vaultName + ' / ' + result.path;
    $('#save-receipt').classList.remove('hidden');
    if (write.pendingTags?.length) {
      try {
        await callTool('manage_tags', { vault: write.vault, path: result.path, operation: 'add', tags: write.pendingTags });
      } catch (error) {
        tagSyncError = error;
      }
      if (controller.signal.aborted) return;
    }
  }
  if (write.method === 'daily_note' && vault?.id === write.vault) {
    await clearSavedInput($('#daily-input'), write);
    if (controller.signal.aborted) return;
    if (result.exists) renderDaily(result);
    else if (activeTab === 'daily') void loadDaily(true);
  }
  if (tagSyncError) {
    setStatus(ui(
      '正文已保存：' + result.path + '，但标签未写入（' + (tagSyncError.message || '请检查标签格式') + '）。',
      'Note saved (' + result.path + '), but tags could not be updated. Check tag names and try again.'
    ));
  } else {
    setStatus(result.templateWarning
      ? ui('日记已保存，模板无法读取，已用默认标题创建。', 'Daily note saved with a default heading because the template could not be read.')
      : ui('已保存：' + result.path, 'Saved: ' + result.path));
  }
  await clearPendingWrite();
}

async function checkWriteReceipt() {
  if (!pendingWrite || writePending || !connectionReady) return;
  const write = pendingWrite;
  writePending = true;
  recoveryState = 'checking';
  updateControls();
  try {
    const result = await callTool('write_receipt', { method: write.method, vault: write.vault, idempotencyKey: write.key }, 15000);
    if (controller.signal.aborted) return;
    if (result.state === 'saved' && typeof result.path === 'string') {
      await finishWrite(write, result);
    } else {
      if (typeof result.path === 'string') write.target = result.path;
      recoveryState = result.state === 'missing' ? 'missing' : 'unconfirmed';
    }
  } catch {
    if (!controller.signal.aborted) recoveryState = 'waiting';
  } finally {
    writePending = false;
    if (!controller.signal.aborted) updateControls();
  }
}

async function sendWrite(write) {
  writePending = true;
  updateControls();
  setStatus(ui('正在保存到「' + write.vaultName + '」…', 'Saving to ' + write.vaultName + '…'));
  try {
    if (!pendingWrite) {
      try {
        write.inputHash = await hashInput(write.input);
        await persistPendingWrite(write);
      } catch {
        setStatus(ui('无法保存本次恢复信息。请重新打开工作台后提交。', 'Could not save recovery information. Reopen the workbench and submit again.'));
        return;
      }
      pendingWrite = write;
    }
    if (controller.signal.aborted) return;
    recoveryState = '';
    updateRecovery();
    const result = await callTool(write.method, { ...write.args, idempotencyKey: write.key });
    if (typeof result?.path !== 'string' || !result.path) throw new Error('Missing save receipt');
    if (!controller.signal.aborted) await finishWrite(write, result);
  } catch (error) {
    if (controller.signal.aborted) return;
    if (error.writeNotCommitted) {
      await clearPendingWrite();
      if (error.code === 'NOTE_ALREADY_EXISTS') {
        setStatus(ui('同路径笔记已存在。可更改路径，或选择追加。', 'A note already exists at that path. Change the path or choose an append option.'));
      } else {
        reportError(error, '保存未完成，草稿已保留。请检查目标或写入规则。', 'The save did not complete. Your draft is still here. Check the target or its write rules.');
      }
    } else {
      recoveryState = 'waiting';
      setStatus();
    }
  } finally {
    writePending = false;
    if (!controller.signal.aborted) updateControls();
  }
}

function startWrite(method, target, args, input, extra = {}) {
  return sendWrite({ key: crypto.randomUUID(), method, vault: vault.id, vaultName: vault.name, target, args, input, ...extra });
}

function showSavedNote(saved, message) {
  savedNote = saved;
  $('#saved-path').textContent = saved.vault.name + ' / ' + saved.path;
  $('#save-receipt').classList.remove('hidden');
  setStatus(message);
}

// Choosing "Save to Obsidian" under a reply saves it at once. The request ID comes from the reply
// itself, so showing the view again for the same reply returns the existing note instead of a copy.
async function autoSaveReply() {
  const ctx = app.getHostContext()?.cindy;
  if (!isReplyCapture(ctx) || !connectionReady || !vault || statusPending || writePending || pendingWrite ||
      !['', 'waiting'].includes(replySave.state)) return;
  const message = ctx?.context?.message;
  const text = replyText(message);
  if (!text) return;
  if (message?.isStreaming) {
    replySave.state = 'waiting';
    setStatus(ui('回复完成后会自动保存…', 'The reply will be saved when it finishes…'));
    updateControls();
    return;
  }
  if (writePolicy.readOnly || writePolicy.writeFolders?.length === 0) {
    replySave.state = 'failed';
    setStatus(ui('这个知识库不允许写入，可以换一个知识库后手动保存。', 'This vault does not allow writes. Choose another vault and save manually.'));
    updateControls();
    return;
  }
  const sessionId = ctx?.source?.sessionId || '';
  const digest = await hashInput(sessionId + '\n' + (message?.clientId || '') + '\n' + text);
  if (!['', 'waiting'].includes(replySave.state) || controller.signal.aborted) return;
  if (!digest) {
    replySave.state = 'failed';
    updateControls();
    return;
  }
  replySave = { key: 'reply-' + digest.slice(0, 48), state: 'saving' };
  const saveVault = vault;
  writePending = true;
  updateControls();
  setStatus(ui('正在保存这条回复…', 'Saving this reply…'));
  try {
    const result = await callTool('capture_reply', {
      content: text,
      vault: saveVault.id,
      idempotencyKey: replySave.key,
      ...(sessionId ? { sessionId } : {}),
    });
    if (controller.signal.aborted) return;
    if (result.companion?.folder) companion = result.companion;
    replySave.state = 'saved';
    replyEdited = false;
    showSavedNote({ vault: { id: result.vault?.id || saveVault.id, name: result.vault?.name || saveVault.name }, path: result.path },
      result.replayed
        ? ui('这条回复之前已保存过，没有重复保存。', 'This reply was already saved, so no copy was made.')
        : ui('已保存：' + result.path, 'Saved: ' + result.path));
  } catch (error) {
    if (controller.signal.aborted) return;
    replySave.state = 'failed';
    reportError(error, '没能自动保存。可以检查下面的内容后手动保存。', 'The reply was not saved automatically. Review it below and save it manually.');
  } finally {
    writePending = false;
    if (!controller.signal.aborted) {
      updateTarget();
      updateControls();
    }
  }
}

async function loadCompanion() {
  const ctx = app.getHostContext()?.cindy;
  const sessionId = ctx?.source?.sessionId;
  if (!sessionId || isReplyCapture(ctx) || companionLookup === sessionId || !connectionReady) return;
  companionLookup = sessionId;
  try {
    const data = await callTool('companion_folders', { sessionId }, 20000);
    if (data.current?.folder) companion = data.current;
  } catch {
    // Without a partner the inbox stays the default folder.
  }
  if (!controller.signal.aborted) {
    updateTarget();
    updateControls();
  }
}

function renderCompanions(data) {
  const help = $('#companion-help');
  const list = $('#companion-list');
  list.replaceChildren();
  if (data.error === 'PERMISSION_DENIED') {
    help.textContent = ui('需要在插件详情中允许查看伙伴，才能设置专属文件夹。', 'Allow this plugin to look up partners in its details to set partner folders.');
    return;
  }
  if (data.error) {
    help.textContent = ui('暂时无法读取伙伴列表。', 'Partners are unavailable right now.');
    return;
  }
  help.textContent = data.root
    ? ui('伙伴在自己的对话中保存的新笔记，没写目录或写到收件箱时会放进它的文件夹。未单独设置的伙伴使用「' + data.root + '/伙伴名」。',
      'When a partner saves a new note in its conversation with no folder, or to the inbox, it goes into the partner’s folder. Partners without their own setting use ' + data.root + '/<name>.')
    : ui('只有下面设置过文件夹的伙伴使用专属文件夹，其他伙伴保存到收件箱「' + data.inboxFolder + '」。',
      'Only partners with a folder set below use one. Others save to the inbox (' + data.inboxFolder + ').');
  if (!data.companions.length) {
    const empty = document.createElement('p');
    empty.className = 'help';
    empty.textContent = ui('这台电脑上还没有可用的伙伴。', 'No partners are available on this computer.');
    list.append(empty);
    return;
  }
  for (const item of data.companions) {
    const row = document.createElement('div');
    row.className = 'companion-row';
    const name = document.createElement('span');
    name.className = 'companion-name';
    name.textContent = (item.name || item.id) + (data.current?.id === item.id ? ui('（当前对话）', ' (this conversation)') : '');
    const input = document.createElement('input');
    input.maxLength = 240;
    input.value = item.custom ? item.folder : '';
    input.placeholder = item.folder || ui('收件箱 ', 'Inbox ') + data.inboxFolder;
    input.setAttribute('aria-label', ui('「' + (item.name || item.id) + '」的文件夹', 'Folder for ' + (item.name || item.id)));
    const save = document.createElement('button');
    save.type = 'button';
    save.textContent = ui('保存', 'Save');
    const reset = document.createElement('button');
    reset.type = 'button';
    reset.textContent = ui('恢复默认', 'Use default');
    reset.classList.toggle('hidden', !item.custom);
    const submit = async (folder) => {
      for (const control of [input, save, reset]) control.disabled = true;
      try {
        const result = await callTool('set_companion_folder', { companionId: item.id, folder });
        setStatus(result.companion.folder
          ? ui('「' + (item.name || item.id) + '」的文件夹：' + result.companion.folder, (item.name || item.id) + ' folder: ' + result.companion.folder)
          : ui('「' + (item.name || item.id) + '」将保存到收件箱。', (item.name || item.id) + ' will save to the inbox.'));
        await loadCompanions(true);
      } catch (error) {
        reportError(error, '文件夹没有保存，请检查目录名称。', 'The folder was not saved. Check the folder name.');
        for (const control of [input, save, reset]) control.disabled = false;
      }
    };
    save.onclick = () => void submit(input.value.trim());
    input.onkeydown = (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        void submit(input.value.trim());
      }
    };
    reset.onclick = () => void submit('');
    row.append(name, input, save, reset);
    list.append(row);
  }
}

async function loadCompanions(force = false) {
  if (companionsLoading || !connectionReady) return;
  if (!force && $('#companion-list').childElementCount) return;
  companionsLoading = true;
  $('#companion-help').textContent = ui('正在读取伙伴…', 'Loading partners…');
  try {
    const sessionId = app.getHostContext()?.cindy?.source?.sessionId;
    const data = await callTool('companion_folders', sessionId ? { sessionId } : {}, 20000);
    if (controller.signal.aborted) return;
    if (data.current?.folder) companion = data.current;
    else if (data.current === null && companion?.id && sessionId) companion = null;
    renderCompanions(data);
    updateTarget();
  } catch {
    $('#companion-help').textContent = ui('暂时无法读取伙伴列表。', 'Partners are unavailable right now.');
  } finally {
    companionsLoading = false;
  }
}

function renderNoteList(items, heading, empty) {
  listItems = items;
  $('#list-heading').textContent = heading;
  const list = $('#note-list');
  list.replaceChildren();
  if (!items.length) {
    const hint = document.createElement('div');
    hint.className = 'note-item-meta';
    hint.textContent = empty;
    list.append(hint);
  }
  for (const item of items) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'note-item';
    const title = document.createElement('span');
    title.className = 'note-item-title';
    title.textContent = item.title || item.name || item.path;
    const meta = document.createElement('span');
    meta.className = 'note-item-meta';
    meta.textContent = item.path + (item.tags?.length ? ' · #' + item.tags.slice(0, 3).join(' #') : '');
    button.append(title, meta);
    const hit = item.matches?.[0];
    if (hit) {
      const preview = document.createElement('span');
      preview.className = 'note-item-meta';
      preview.textContent = ui('正文第 ' + hit.line + ' 行、第 ' + hit.column + ' 列', 'Body line ' + hit.line + ', column ' + hit.column) + ' · ' + hit.context;
      button.append(preview);
    }
    button.onclick = () => item.type === 'directory' ? void browseFolder(item.path) : void openNote(item.path);
    list.append(button);
  }
  markSelectedNote();
}

function markSelectedNote() {
  const buttons = $('#note-list').querySelectorAll('button');
  buttons.forEach((button, index) => {
    const selected = currentNote?.path === listItems[index].path;
    button.classList.toggle('selected', selected);
    button.setAttribute('aria-pressed', String(selected));
  });
}

function showRecent() {
  searchPage = null;
  $('#btn-next-search').classList.add('hidden');
  $('#btn-parent').classList.add('hidden');
  $('#btn-clear-search').classList.add('hidden');
  renderNoteList(recentNotes, ui('最近修改', 'Recently edited'), ui('这个知识库还没有笔记。', 'This vault has no notes yet.'));
}

function showSearch(result, query = $('#search-input').value.trim(), append = false) {
  const count = result.totalMatches ?? 0;
  const page = result.results ?? [];
  const items = append ? [...listItems, ...page] : page;
  searchPage = { query, cursor: result.nextCursor };
  $('#btn-next-search').classList.toggle('hidden', !result.nextCursor);
  $('#btn-parent').classList.add('hidden');
  const shown = items.length < count ? items.length + ' / ' + count : String(count);
  $('#btn-clear-search').classList.remove('hidden');
  renderNoteList(items, ui('搜索结果（' + shown + '）', 'Search results (' + shown + ')'),
    ui('没有匹配的笔记，试试其他关键词。', 'No matching notes. Try a different search.'));
  if (result.truncatedScan || result.partialBodyIndex) setStatus(ui('部分笔记正文未纳入索引，结果可能不完整。', 'Some note bodies were not indexed, so results may be incomplete.'));
  else setStatus();
}

function renderPreview(note) {
  currentNote = note;
  $('#note-preview').classList.toggle('hidden', !note);
  markSelectedNote();
  updateControls();
  if (!note) return;
  $('#prev-title').textContent = note.title || note.path;
  $('#prev-path').textContent = note.path;
  const tags = $('#prev-tags');
  tags.replaceChildren();
  for (const tag of note.tags ?? []) {
    const label = document.createElement('span');
    label.className = 'tag';
    label.textContent = '#' + tag;
    tags.append(label);
  }
  $('#prev-body').textContent = note.content || ui('（空白笔记）', '(Empty note)');
  $('#prev-truncated').classList.toggle('hidden', !note.truncated);
  $('#prev-links').textContent = ui(
    '出链 ' + (note.outlinks?.length ?? 0) + ' · 反向链接 ' + (note.backlinks?.length ?? 0),
    (note.outlinks?.length ?? 0) + ' outgoing · ' + (note.backlinks?.length ?? 0) + ' backlinks'
  );
  const paths = new Map();
  for (const link of note.outlinks ?? []) {
    if (link.resolvedPath) paths.set(link.resolvedPath, '↗ ' + (link.alias || link.target));
  }
  for (const link of note.backlinks ?? []) {
    if (!paths.has(link.path)) paths.set(link.path, '↙ ' + link.title);
  }
  paths.delete(note.path);
  const links = $('#link-list');
  links.replaceChildren();
  $('#note-links').classList.toggle('hidden', !paths.size);
  for (const [path, label] of [...paths].slice(0, 24)) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.title = path;
    button.onclick = () => void openNote(path);
    links.append(button);
  }
}

async function openNote(path) {
  if (!vault || statusPending || pickerPending || writePending) return;
  const seq = ++previewRequest;
  const vaultId = vault.id;
  setStatus(ui('正在读取笔记…', 'Reading note…'));
  try {
    const note = await callTool('read_note', { vault: vaultId, path, maxChars: 25000 });
    if (seq !== previewRequest) return;
    renderPreview(note);
    setStatus();
  } catch (error) {
    if (seq === previewRequest) reportError(error, '无法读取这篇笔记，请刷新后重试。', 'Could not read this note. Refresh and try again.');
  }
}

function applyStatus(data) {
  const previousVault = vault;
  statusPayload = data;
  executionHost = data.executionHost || '';
  vault = data.activeVault ?? null;
  writePolicy = data.writePolicy ?? { readOnly: false, writeFolders: null };
  renderWritePolicy();
  inbox = data.summary?.inboxFolder || 'Inbox';
  if (data.summary?.companion?.folder) companion = data.summary.companion;
  localDate = data.summary?.localDate || '';
  if (previousVault?.id !== vault?.id) {
    previewRequest++;
    dailyRequest++;
    renderPreview(null);
    $('#daily-body').textContent = '';
    dailyDate = '';
    $('#search-input').value = '';
    if (previousVault) {
      $('#cap-path').value = '';
      $('#cap-mode').value = 'create';
      $('#cap-heading').value = '';
      updateHeadingField();
    }
    savedNote = null;
    $('#save-receipt').classList.add('hidden');
  }
  const select = $('#vault-select');
  select.replaceChildren();
  if (!vault) {
    select.add(new Option(ui('请选择知识库', 'Select a vault'), '', true, true));
    select.options[0].disabled = true;
  }
  const available = (data.vaults ?? []).filter((item) => item.exists);
  for (const item of available) {
    const duplicate = available.some((other) => other.id !== item.id && other.name === item.name);
    const option = new Option(duplicate ? item.name + ' — ' + item.path : item.name, item.id);
    option.title = item.path;
    select.add(option);
  }
  select.value = vault?.id ?? '';
  select.title = vault?.path ?? '';
  recentNotes = data.summary?.recentNotes ?? [];
  const stats = data.summary;
  $('#vault-stats').textContent = stats ? ui(
    stats.noteCount + ' 篇笔记 · ' + stats.openTaskCount + ' 项未完成待办',
    stats.noteCount + ' notes · ' + stats.openTaskCount + ' open tasks'
  ) : '';
  showRecent();
  updateTarget();
}

function reportVaultStatus() {
  if (!vault) {
    setStatus(statusPayload?.vaults?.some((item) => item.exists)
      ? ui('默认知识库不可用，请从列表选择。', 'The default vault is unavailable. Choose one from the list.')
      : '');
  } else if (statusPayload?.summary?.truncatedScan) {
    setStatus(ui('索引只覆盖了部分文件，可在 Obsidian 中查阅全部笔记。', 'The index covers part of this vault. Browse all notes in Obsidian.'));
  } else {
    setStatus();
  }
}

async function refreshStatus(vaultId, force = false) {
  const seq = ++statusRequest;
  searchRequest++;
  previewRequest++;
  dailyRequest++;
  statusPending = true;
  updateControls();
  setStatus(ui('正在读取知识库…', 'Loading vault…'));
  try {
    const data = await callTool('vault_status', { ...(vaultId ? { vault: vaultId } : {}), refresh: force });
    if (seq !== statusRequest) return false;
    applyStatus(data);
    reportVaultStatus();
    return true;
  } catch (error) {
    if (seq === statusRequest) {
      $('#vault-select').value = vault?.id ?? '';
      reportError(error, '读取知识库失败，请刷新索引或重新选择目录。', 'Could not read the vault. Refresh the index or choose a folder again.');
    }
    return false;
  } finally {
    if (seq === statusRequest) {
      statusPending = false;
      updateControls();
    }
  }
}

async function loadDaily(afterSave = false) {
  if (!vault || pickerPending || statusPending || (writePending && !afterSave)) return;
  const seq = ++dailyRequest;
  const vaultId = vault.id;
  dailyDate = '';
  $('#daily-title').textContent = ui('今日日记', 'Daily note');
  $('#daily-body').textContent = ui('正在读取…', 'Loading…');
  try {
    const data = await callTool('daily_note', { vault: vaultId, action: 'read' });
    if (seq === dailyRequest) renderDaily(data);
  } catch (error) {
    if (seq === dailyRequest) {
      $('#daily-body').textContent = chinese && error.code ? error.message
        : ui('无法读取日记，请刷新重试。', 'Could not read today’s note. Try refreshing.');
    }
  }
}

function renderDaily(data) {
  dailyDate = data.date || '';
  $('#daily-title').textContent = ui('今日日记', 'Daily note') + (data.date ? ' · ' + data.date : '');
  $('#daily-body').textContent = data.previewWarning
    ? ui('日记已保存，请刷新预览。', 'Daily note saved. Refresh to view it.')
    : data.exists
    ? data.content || ui('（今日日记为空）', '(Empty note)')
    : ui('今天还没有日记。添加一条记录或待办即可创建。', 'Add an entry or task to create today’s note.');
}

function updateHeadingField() {
  const useHeading = $('#cap-mode').value === 'append-heading';
  $('#cap-heading-wrap').classList.toggle('hidden', !useHeading);
  $('#cap-heading').disabled = !useHeading;
  $('#cap-heading').required = useHeading;
}

async function browseFolder(folder) {
  if (!vault || statusPending || pickerPending || writePending) return;
  const seq = ++searchRequest;
  setStatus(ui('正在读取目录…', 'Reading folder…'));
  try {
    const result = await callTool('list_files', { vault: vault.id, folder, extension: 'md' });
    if (seq !== searchRequest) return;
    browsedFolder = result.folder;
    searchPage = null;
    $('#search-input').value = '';
    $('#btn-next-search').classList.add('hidden');
    $('#btn-clear-search').classList.add('hidden');
    $('#btn-parent').classList.toggle('hidden', !browsedFolder);
    renderNoteList(result.entries, (browsedFolder ? '/' + browsedFolder : '/'), ui('这个目录没有子目录或笔记。', 'This folder has no subfolders or notes.'));
    setStatus(result.truncated ? ui('部分目录项未显示。', 'Some folder entries are unavailable.') : '');
  } catch (error) {
    if (seq === searchRequest) reportError(error, '无法读取目录。', 'Could not read that folder.');
  }
}

async function search(query, cursor) {
  if (!vault || statusPending || pickerPending || writePending) return;
  const seq = ++searchRequest;
  if (!query) {
    showRecent();
    reportVaultStatus();
    return;
  }
  setStatus(ui('正在搜索…', 'Searching…'));
  try {
    const result = await callTool('search_notes', { vault: vault.id, query, limit: 20, ...(cursor ? { cursor } : {}) });
    if (seq === searchRequest) showSearch(result, query, Boolean(cursor));
  } catch (error) {
    if (seq !== searchRequest) return;
    if (error.code === 'STALE_CURSOR' || error.code === 'INVALID_CURSOR') {
      searchPage = null;
      $('#btn-next-search').classList.add('hidden');
      setStatus(ui('搜索结果已改变，请重新搜索。', 'Search results changed. Run the search again.'));
    } else {
      reportError(error, '搜索失败，请刷新索引后重试。', 'Search failed. Refresh the index and try again.');
    }
  }
}

$('#vault-select').onchange = async () => {
  const picked = $('#vault-select').value;
  if (!picked || picked === vault?.id) return;
  if (await refreshStatus(picked) && activeTab === 'daily') await loadDaily();
};
$('#btn-refresh').onclick = async () => {
  if (!await refreshStatus(vault?.id, true)) return;
  if (activeTab === 'daily') await loadDaily();
  else if (activeTab === 'browse' && $('#search-input').value.trim()) await search($('#search-input').value.trim());
};
$('#btn-pick-vault').onclick = async () => {
  searchRequest++;
  previewRequest++;
  dailyRequest++;
  pickerPending = true;
  updateControls();
  setStatus(executionHost
    ? ui('请在「' + executionHost + '」的目录选择框中选择知识库…', 'Choose the vault folder in the picker on ' + executionHost + '…')
    : ui('请在运行插件的电脑上选择知识库文件夹…', 'Choose a vault folder on the computer running the plugin…'));
  let picked;
  try {
    picked = await callTool('pick_vault_dir', {}, 10 * 60 * 1000);
  } catch (error) {
    if (error.code === 'CANCELLED' || error.code === 'PICK_CANCELLED') reportVaultStatus();
    else reportError(error, '无法添加知识库，请到运行插件的电脑上重试。', 'Could not add the vault. Try again on the computer running the plugin.');
  } finally {
    pickerPending = false;
    updateControls();
  }
  if (!picked) return;
  $('#search-input').value = '';
  if (picked.activeVault) {
    applyStatus(picked);
    reportVaultStatus();
    updateControls();
  } else if (!await refreshStatus(picked.picked?.path)) {
    return;
  }
  if (activeTab === 'daily') await loadDaily();
};
for (const button of document.querySelectorAll('.tab-btn')) {
  button.onclick = () => {
    setStatus();
    showTab(button.dataset.tab);
    if (activeTab === 'daily') void loadDaily();
  };
}
$('#cap-mode').onchange = updateHeadingField;
$('#vault-write-scope').onchange = () => {
  $('#vault-folders-label').classList.toggle('hidden', $('#vault-write-scope').value === 'all');
};
$('#vault-policy-form').onsubmit = async (event) => {
  event.preventDefault();
  if ($('#btn-save-policy').disabled || !vault) return;
  const restrictFolders = $('#vault-write-scope').value === 'folders';
  const folders = restrictFolders ? $('#vault-write-folders').value.split(/\r?\n/).map((folder) => folder.trim()).filter(Boolean) : [];
  const readOnly = $('#vault-read-only').checked;
  policyPending = true;
  updateControls();
  try {
    const data = await callTool('set_vault_write_policy', { vault: vault.id, readOnly, restrictFolders, folders });
    writePolicy = data.policy;
    renderWritePolicy();
    updateTarget();
    setStatus(ui('写入规则已保存。', 'Write rules saved.'));
  } catch (error) {
    reportError(error, '写入规则未保存。', 'Write rules were not saved.');
  } finally {
    policyPending = false;
    updateControls();
  }
};
$('#btn-folders').onclick = () => void browseFolder('');
$('#btn-parent').onclick = () => void browseFolder(browsedFolder.split('/').slice(0, -1).join('/'));
$('#btn-next-search').onclick = () => {
  if (searchPage?.cursor) void search(searchPage.query, searchPage.cursor);
};
$('#search-form').onsubmit = (event) => {
  event.preventDefault();
  void search($('#search-input').value.trim());
};
$('#btn-clear-search').onclick = () => {
  $('#search-input').value = '';
  void search('');
  $('#search-input').focus();
};

$('#btn-insert-draft').onclick = async () => {
  const note = currentNote;
  if (!note || !vault || draftPending) return;
  const noteVault = vault;
  draftPending = true;
  updateControls();
  try {
    const link = note.path.replace(/\.md$/i, '') + (note.path.includes('/') ? '|' + note.title : '');
    const reference = '[[' + link + ']] (Obsidian: ' + note.path + ', vault: ' + noteVault.name + ' [' + noteVault.id + ']) ';
    await callTool('cindy.ui.draft', { mode: 'append', text: reference }, 15000);
    setStatus(ui('已将「' + note.title + '」的引用插入输入框。', 'Inserted a reference to ' + note.title + ' from ' + noteVault.name + ' into the draft.'));
  } catch {
    setStatus(ui('无法插入引用，请从当前对话的 Obsidian 按钮重新打开。', 'Could not insert the reference. Reopen Obsidian from the conversation toolbar.'));
  } finally {
    draftPending = false;
    updateControls();
  }
};

$('#btn-open-obs').onclick = async () => {
  if (!currentNote || !vault) return;
  const { path } = currentNote;
  try {
    await callTool('open_in_obsidian', { vault: vault.id, path });
    setStatus(ui('已向知识库所在电脑的 Obsidian 发送打开请求：' + path, 'Asked Obsidian on the vault computer to open ' + path));
  } catch {
    setStatus(ui('无法在知识库所在电脑发送打开请求，请检查连接和该电脑的 Obsidian 安装。', 'Could not send the open request. Check the connection and the Obsidian installation on the vault computer.'));
  }
};

$('#btn-fill-context').onclick = () => {
  const text = contextText(app.getHostContext()?.cindy?.input?.mode === 'capture');
  if (text) $('#cap-content').value = text;
};
$('#cap-content').oninput = () => { replyEdited = true; };
$('#capture-form').onsubmit = async (event) => {
  event.preventDefault();
  if (!vault || $('#btn-save-note').disabled) return;
  const path = $('#cap-path').value.trim();
  const mode = $('#cap-mode').value;
  const heading = $('#cap-heading').value.trim();
  const tags = $('#cap-tags').value.split(/[,，]/).map((tag) => tag.trim()).filter(Boolean);
  const content = $('#cap-content').value;
  if (!path || !content.trim() || (mode === 'append-heading' && !heading)) {
    setStatus(ui('请填写路径和正文。按章节追加时还需填写章节标题。', 'Enter a path and body. To append under a heading, enter the heading too.'));
    return;
  }
  const args = {
    vault: vault.id,
    path,
    mode,
    content,
    ...(heading && mode === 'append-heading' ? { heading } : {}),
    ...(mode === 'create' && tags.length ? { frontmatter: { tags } } : {}),
  };
  $('#save-receipt').classList.add('hidden');
  await startWrite('write_note', path, args, content, mode !== 'create' && tags.length ? { pendingTags: tags } : {});
};
$('#btn-open-saved').onclick = async () => {
  if (!savedNote) return;
  try {
    await callTool('open_in_obsidian', { vault: savedNote.vault.id, path: savedNote.path });
    setStatus(ui('已在知识库所在电脑打开 Obsidian：' + savedNote.path, 'Asked Obsidian on the vault computer to open ' + savedNote.path));
  } catch {
    setStatus(ui('无法打开 Obsidian，请检查知识库所在电脑的 Obsidian 安装。', 'Could not open Obsidian. Check the installation on the vault computer.'));
  }
};
$('#btn-edit-reply').onclick = () => {
  replySave.state = 'editing';
  $('#cap-mode').value = 'create';
  updateHeadingField();
  updateTarget();
  updateControls();
  $('#cap-path').focus();
};
$('#companion-settings').ontoggle = () => {
  if ($('#companion-settings').open) void loadCompanions();
};
$('#btn-view-saved').onclick = () => {
  if (!savedNote || savedNote.vault.id !== vault?.id) return;
  showTab('browse');
  void openNote(savedNote.path);
};

$('#btn-load-daily').onclick = () => void loadDaily();
async function submitDaily(action) {
  if (!vault || $('#btn-daily-append').disabled) return;
  const input = $('#daily-input');
  const original = input.value;
  const content = original.trim();
  if (!content) {
    input.reportValidity();
    return;
  }
  const date = dailyDate || localDate;
  if (!date) {
    setStatus(ui('请先读取今日日记，再提交记录。', 'Load today’s note before saving an entry.'));
    return;
  }
  dailyRequest++;
  await startWrite('daily_note', date, { vault: vault.id, action, content, date }, original);
}
$('#daily-form').onsubmit = (event) => {
  event.preventDefault();
  void submitDaily('append');
};
$('#btn-daily-task').onclick = () => void submitDaily('add-task');

$('#btn-check-write').onclick = () => void checkWriteReceipt();
$('#btn-retry-write').onclick = () => {
  if (!writePending && recoveryState === 'missing' && pendingWrite?.args) void sendWrite(pendingWrite);
};
$('#btn-dismiss-write').onclick = async () => {
  if (writePending || !['unconfirmed', 'missing'].includes(recoveryState)) return;
  writePending = true;
  updateControls();
  await clearPendingWrite();
  writePending = false;
  if (!controller.signal.aborted) updateControls();
};

app.ontoolresult = (result) => {
  const data = result?.structuredContent;
  if (!data?.status) return;
  statusRequest++;
  statusPending = false;
  initialized = true;
  if (data.companion?.folder) companion = data.companion;
  syncHostContext();
  applyStatus(data.status);
  reportVaultStatus();
  if (data.mode) showTab(data.mode);
  if (data.query) $('#search-input').value = data.query;
  if (data.searchResults) showSearch(data.searchResults);
  if (data.initialNote) renderPreview(data.initialNote);
  if (data.initialNoteError) setStatus(ui(data.initialNoteError, 'Could not load the requested note.'));
  if (activeTab === 'daily') void loadDaily();
  updateControls();
};
app.onhostcontextchanged = syncHostContext;
app.onteardown = async () => { controller.abort(); return {}; };
updateControls();

try {
  await app.connect();
  restorePendingWrite();
  connectionReady = true;
  syncHostContext();
  if (!initialized) {
    initialized = true;
    const input = app.getHostContext()?.cindy?.input ?? {};
    if (input.mode) showTab(input.mode);
    if (await refreshStatus(input.vault)) {
      void autoSaveReply();
      void loadCompanion();
      if (input.query) {
        $('#search-input').value = input.query;
        await search(input.query);
      }
      if (activeTab === 'daily') await loadDaily();
    }
  }
  if (pendingWrite) void checkWriteReceipt();
} catch {
  setStatus(ui('无法连接 Cindy，请重新打开工作台。', 'Could not connect to Cindy. Reopen the workbench and try again.'));
}
</script>
</body>
</html>
